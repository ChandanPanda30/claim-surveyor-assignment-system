spring.application.name=claim-surveyor

# Environment settings (parameterised for Jenkins / Docker / Ansible later)
server.port=${PORT:8080}
app.environment=${APP_ENV:dev}

# H2 file database; override DB_PATH per environment
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/claimdb};AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health check endpoint: /actuator/health
management.endpoints.web.exposure.include=health,info
