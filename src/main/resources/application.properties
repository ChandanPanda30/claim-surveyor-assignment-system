spring.application.name=claim-surveyor

# Environment settings (parameterised for Jenkins / Docker / Ansible later)
server.port=${PORT:8080}
app.environment=${APP_ENV:@app.environment@}

# H2 file database; override DB_PATH per environment
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/claimdb};AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health check endpoint: /actuator/health
management.endpoints.web.exposure.include=health,info

# Supporting document uploads (our own 2 MB rule is enforced in ClaimService)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
